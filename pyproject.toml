[project]
name = "imigraph"
version = "0.1.0"
description = "Imitating systems with graphs"
readme = "README.md"
license = "Apache-2.0"
# 3.14 matches Pyodide 314.x, the Python runtime of the WebAssembly GUI.
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.4",
  "scipy>=1.18",
  "networkx>=3.6",
]

[dependency-groups]
dev = [
  "playwright==1.64.1",
  "pytest>=9",
  "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imigraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
