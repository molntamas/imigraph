[project]
name = "imigraph"
version = "0.1.0"
description = "Imitating systems with graphs"
readme = "README.md"
license = "Apache-2.0"
# 3.14 matches Pyodide 314.x, the Python runtime of the WebAssembly GUI.
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.4",
  "scipy>=1.18",
  "networkx>=3.6",
]

[dependency-groups]
dev = [
  "playwright==1.64.1",
  "pytest>=9",
  "ruff>=0.17.3",
  "ty>=0.0.95",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imigraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ruff and ty run with their default configuration. The one exception: EXE002 (executable file
# without shebang) fires for every file inside the Docker container, where the Windows bind mount
# reports all files as executable; the files are 644 in git.
[tool.ruff.lint]
ignore = ["EXE002"]
