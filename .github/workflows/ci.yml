# Lint, format, type check and test on every push and pull request. The same commands as in
# CLAUDE.md, run with the locked dependencies (uv.lock) and the Python version of .python-version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check . --output-format github

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check --output-format github

      - name: Tests (pytest)
        run: uv run pytest
